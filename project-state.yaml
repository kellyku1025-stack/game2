project_id: little-dream-finance
mode: guided
current_phase: build
requirements_version: 0.3
gate_status: visual_reference_revision_in_progress
dt_handoff: pending
sdlc_release: four_unit_web_prototype_published
final_acceptance: pending
confirmed:
  - 國中生為目標對象；生活理財投資為教學主題。
  - 遊戲依序包含四個互動單元：需要／想要／儲蓄／投資配置、三店購物分類、六題理財紅綠燈、突發支出決策。
  - 每單元顯示得分；完成互動取得星鑰；結尾顯示四單元成績及學習進步成果。
  - 使用 Godot 與 Blender；使用者提供 Little Nightmares 作為氣氛參考。
  - 教育優先 profile：Learning 50%, Appropriate challenge 25%, Engagement 15%, Motivation 10%（Learning-first preset）。
  - Guessing/exploitation penalty strength is strong; cognitive-overload penalty strength is moderate.
  - 玩法方向已由使用者選定：D「貨艙星箱配置」。
  - 最新視覺需求已由使用者更新：明亮可愛的等角星港小島經營風格，包含水岸、草地、市集、花園與圓角高對比 HUD；原先紙雕方向已被此新要求取代。
  - 使用者要求部署瀏覽器版至 GitHub Pages（GitHub.io）。
  - 使用者要求持續製作直到可玩的初版完成；已授權製作垂直切片。
assumptions:
  - Windows 單人桌面版；繁體中文；沒有計時壓力、真實金錢或交易。
  - 以 12–15 歲國中生為暫定年齡帶；預估遊玩時間 10–15 分鐘，待原型觀察。
  - 預算關卡的參考範圍為需要 35–60%、想要最多 25%、儲蓄至少 15%、投資 5–25%；這些是教學情境規則，不是個人理財建議。
  - 每次錯誤扣 10 分；配置合計未達 100% 是可修正提醒，不扣分。
  - 不收集個人資料；任何兒童測試先取得監護人／機構同意。
  - 將 strong/moderate 量化為 pG=0.25、pC=0.15；暫不設 G/C 硬性淘汰門檻，使用 review flags。
open_questions:
  - 國中不同年級的零用錢、消費經驗和課程用語仍需教師檢視。
