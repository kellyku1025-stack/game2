required_tests:
  - 手動完成四個互動單元；檢查商品分類理由、六題題數、突發支出答錯提示、星鑰、各單元分數與結算畫面。
  - 在等角島嶼改版後檢查新場景、角色、圓角 HUD、文字對比、3D 道具位置與互動視窗。
  - 對目標年齡進行有監護人／機構同意的可用性測試。
passed_tests:
  - Godot 4.7.2 headless 載入 main scene；最近一次檢查無遊戲腳本錯誤。
  - Godot 4.7.2 視窗版啟動初版；實際操作第一關正確配置、第二關分散配置、取得鑰匙、總分與結尾成果，並確認可重新開始。
  - 實際提交錯誤配置，確認提示、星鑰鎖定與每次扣 25 分（100 降至 75）；星幣未分完時改為不扣分提醒。
  - Blender 5.2.4 LTS 腳本成功輸出 BLEND 與 GLB；遊戲透過 Godot GLTF API 載入模型，視窗中可見 3D 道具預覽。
  - Godot 4.7.2 Web 匯出成功；GitHub Pages Actions 將遊戲發布到 https://kellyku1025-stack.github.io/game2/，根網址導向版本化建置路徑。
  - 公開瀏覽器頁面已目視確認場景 B 與繁體中文正常顯示，瀏覽器 console 無 error/warning。
  - 國中生四單元修訂在提交 faed467 的 GitHub Actions run #7 匯出並部署成功；瀏覽器確認新版本 HUD 顯示「國中生生活理財任務」與單元 1 / 4。
  - 新名稱「星港理財局：零用錢任務」在提交 622323d 的 Pages run #9 部署成功；瀏覽器分頁標題和遊戲 HUD 均顯示新名稱。
pending_tests:
  - 新等角小島視覺尚未執行 Godot 預覽或重新匯出至 GitHub Pages。
  - 國中生四單元改版尚未逐項手動遊玩；預算邊界、九項商品解釋、六題流程、突發支出重試及重新開始均待確認。
  - 目標年齡／教師可用性測試待安排。
known_limitations:
  - GitHub Pages 目前仍是較早的四單元版本；最新等角小島場景尚未發布。
  - 四單元完整互動流程尚未手動測試。
  - 國中生／教師玩家證據與最終驗收仍待完成。
  - 尚無玩家證據；設計評分均為 AI pre-score，不代表學習成效。
  - Blender Toolkit addon 未安裝；目前模型由 Blender Python 腳本生成。
