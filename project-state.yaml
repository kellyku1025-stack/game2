project_id: little-dream-finance
mode: guided
current_phase: prototype-published
requirements_version: 0.2
gate_status: playable_initial_build_published_visual_direction_pending
dt_handoff: pending
sdlc_release: prototype_published
final_acceptance: pending
confirmed:
  - 小學生為目標對象；生活理財投資為教學主題。
  - 遊戲包含兩關，每關一個互動單元，答題通過後取得鑰匙。
  - 各關顯示得分，結尾顯示學習進步成果。
  - 使用 Godot 與 Blender；使用者提供 Little Nightmares 作為氣氛參考。
  - 教育優先 profile：Learning 50%, Appropriate challenge 25%, Engagement 15%, Motivation 10%（Learning-first preset）。
  - Guessing/exploitation penalty strength is strong; cognitive-overload penalty strength is moderate.
  - 玩法方向已由使用者選定：D「貨艙星箱配置」。
  - 使用者要求持續製作直到可玩的初版完成；已授權製作垂直切片。
assumptions:
  - Windows 單人桌面版；短繁體中文文字；沒有計時壓力、真實金錢或交易。
  - 預估遊玩時間 8–12 分鐘；實際時長待原型觀察。
  - 不收集個人資料；任何兒童測試先取得監護人／機構同意。
  - 將 strong/moderate 量化為 pG=0.25、pC=0.15；暫不設 G/C 硬性淘汰門檻，使用 review flags。
open_questions:
  - 正式視覺方向仍待選擇三種同內容方案之一（docs/visual-directions.html）；本初版先採原創草稿風格供試玩。
  - 小學生年齡範圍尚未細分；目前按約 7–11 歲設計。
artifacts:
  project_brief: docs/project-brief.md
  design_tournament: docs/design-tournament.md
  visual_directions: docs/visual-directions.html
  decision_log: docs/decision-log.md
  change_log: docs/change-log.md
  traceability: docs/traceability.md
  skill_compliance: docs/skill-compliance.md
