name: Export and deploy Godot web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and web export template
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 "$release/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail --location --retry 3 "$release/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp "$RUNNER_TEMP/templates/templates/web_nothreads_release.zip" "$template_dir/"
          cp "$RUNNER_TEMP/templates/templates/web_nothreads_debug.zip" "$template_dir/"

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          site="$RUNNER_TEMP/site"
          versioned_site="$site/$GITHUB_SHA"
          mkdir -p "$versioned_site"
          "$godot" --headless --path . --editor --quit
          "$godot" --headless --path . --export-release "Web" "$versioned_site/index.html"
          test -s "$versioned_site/index.html"
          cat > "$site/index.html" <<EOF
          <!doctype html>
          <html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./$GITHUB_SHA/"><title>小小夢魔｜紙雕故事書</title></head>
          <body><p>正在開啟最新版本的遊戲… <a href="./$GITHUB_SHA/">若沒有自動跳轉，請按此開始</a></p><script>window.location.replace('./$GITHUB_SHA/');</script></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
